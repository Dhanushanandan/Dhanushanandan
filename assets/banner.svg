<svg width="1200" height="350" viewBox="0 0 1200 350"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#0f172a"/>

<stop offset="50%" stop-color="#1e293b"/>

<stop offset="100%" stop-color="#020617"/>

</linearGradient>


<linearGradient id="text">

<stop offset="0%" stop-color="#38bdf8"/>

<stop offset="50%" stop-color="#818cf8"/>

<stop offset="100%" stop-color="#c084fc"/>

</linearGradient>


<filter id="glow">

<feGaussianBlur stdDeviation="8"
result="coloredBlur"/>

</filter>


</defs>


<!-- Background -->

<rect width="1200"
height="350"
fill="url(#bg)"
rx="30"/>


<!-- Animated glow circles -->

<circle cx="200"
cy="80"
r="80"
fill="#38bdf8"
opacity="0.15">

<animate attributeName="r"
values="80;120;80"
dur="5s"
repeatCount="indefinite"/>

</circle>


<circle cx="1000"
cy="250"
r="100"
fill="#a855f7"
opacity="0.15">

<animate attributeName="r"
values="100;150;100"
dur="6s"
repeatCount="indefinite"/>

</circle>



<!-- Decorative lines -->

<path d="M0 260 Q300 180 600 260 T1200 220"
stroke="#38bdf8"
stroke-width="2"
fill="none"
opacity="0.5"/>


<path d="M0 280 Q300 200 600 280 T1200 240"
stroke="#818cf8"
stroke-width="2"
fill="none"
opacity="0.4"/>



<!-- Main Text -->

<text x="600"
y="125"
text-anchor="middle"
font-family="Segoe UI, Arial"
font-size="55"
font-weight="700"
fill="url(#text)">

Dhanushanandan

</text>



<text x="600"
y="185"
text-anchor="middle"
font-family="Segoe UI, Arial"
font-size="25"
fill="#e2e8f0">

Software Developer • AI • IoT • Cyber Security

</text>



<text x="600"
y="235"
text-anchor="middle"
font-family="monospace"
font-size="20"
fill="#94a3b8">

Building secure and intelligent solutions

</text>



<!-- Floating code symbols -->

<text x="120"
y="160"
font-size="40"
fill="#38bdf8"
opacity="0.7">

&lt;/&gt;

</text>


<text x="1040"
y="160"
font-size="40"
fill="#c084fc"
opacity="0.7">

{}

</text>



<!-- Animation -->

<circle cx="600"
cy="320"
r="5"
fill="#38bdf8">

<animate attributeName="cx"
values="300;900;300"
dur="8s"
repeatCount="indefinite"/>

</circle>


</svg>
