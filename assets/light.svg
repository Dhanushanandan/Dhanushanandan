<svg width="900" height="260"
viewBox="0 0 900 260"
xmlns="http://www.w3.org/2000/svg">


<defs>

<linearGradient id="lightBackground"
x1="0"
y1="0"
x2="1"
y2="1">

<stop offset="0%"
stop-color="#ffffff"/>

<stop offset="50%"
stop-color="#f1f5f9"/>

<stop offset="100%"
stop-color="#dbeafe"/>

</linearGradient>


<linearGradient id="blueText">

<stop offset="0%"
stop-color="#2563eb"/>

<stop offset="100%"
stop-color="#7c3aed"/>

</linearGradient>


</defs>



<!-- Background -->

<rect width="900"
height="260"
rx="25"
fill="url(#lightBackground)"/>



<!-- Decorative waves -->

<path d="M0 210 Q250 130 450 200 T900 170"
fill="none"
stroke="#2563eb"
stroke-width="3"
opacity="0.3"/>


<path d="M0 230 Q250 150 450 220 T900 190"
fill="none"
stroke="#7c3aed"
stroke-width="2"
opacity="0.25"/>



<!-- Technology Nodes -->

<g fill="#2563eb"
opacity="0.6">


<circle cx="120"
cy="80"
r="8"/>


<circle cx="780"
cy="80"
r="8"/>


<circle cx="180"
cy="180"
r="6"/>


<circle cx="720"
cy="180"
r="6"/>


</g>



<!-- Connecting Lines -->

<g stroke="#94a3b8"
stroke-width="2"
opacity="0.5">


<line x1="120"
y1="80"
x2="250"
y2="130"/>


<line x1="780"
y1="80"
x2="650"
y2="130"/>


</g>



<!-- Main Text -->

<text x="450"
y="105"
text-anchor="middle"
font-family="Segoe UI, Arial"
font-size="42"
font-weight="700"
fill="url(#blueText)">

Dhanushanandan

</text>



<text x="450"
y="150"
text-anchor="middle"
font-family="Segoe UI, Arial"
font-size="20"
fill="#334155">

Software Developer | AI | IoT | Cyber Security

</text>



<text x="450"
y="185"
text-anchor="middle"
font-family="monospace"
font-size="16"
fill="#64748b">

Creating innovative solutions through technology

</text>



<!-- Animated Circle -->

<circle cx="450"
cy="220"
r="5"
fill="#2563eb">

<animate attributeName="cx"
values="300;600;300"
dur="7s"
repeatCount="indefinite"/>

</circle>



</svg>
