<svg width="900" height="260"
viewBox="0 0 900 260"
xmlns="http://www.w3.org/2000/svg">


<defs>

<linearGradient id="darkGradient"
x1="0"
y1="0"
x2="1"
y2="1">

<stop offset="0%"
stop-color="#020617"/>

<stop offset="50%"
stop-color="#111827"/>

<stop offset="100%"
stop-color="#1e1b4b"/>

</linearGradient>


<linearGradient id="cyan">

<stop offset="0%"
stop-color="#22d3ee"/>

<stop offset="100%"
stop-color="#818cf8"/>

</linearGradient>


<filter id="blur">

<feGaussianBlur stdDeviation="6"/>

</filter>


</defs>


<!-- Background -->

<rect width="900"
height="260"
rx="25"
fill="url(#darkGradient)"/>



<!-- Circuit Pattern -->

<g stroke="#38bdf8"
stroke-width="2"
opacity="0.25"
fill="none">


<path d="M50 50 H250 V100 H350"/>

<path d="M850 70 H650 V130 H550"/>

<path d="M120 200 H300 V160 H420"/>

<path d="M780 220 H600 V170 H500"/>


</g>



<!-- Circuit Nodes -->

<g fill="#38bdf8">


<circle cx="50"
cy="50"
r="5"/>

<circle cx="350"
cy="100"
r="5"/>

<circle cx="850"
cy="70"
r="5"/>

<circle cx="550"
cy="130"
r="5"/>


<circle cx="120"
cy="200"
r="5"/>

<circle cx="420"
cy="160"
r="5"/>

</g>



<!-- Title -->

<text x="450"
y="100"
text-anchor="middle"
font-family="Segoe UI"
font-size="38"
font-weight="700"
fill="url(#cyan)">

Dhanushanandan

</text>



<text x="450"
y="145"
text-anchor="middle"
font-family="monospace"
font-size="18"
fill="#cbd5e1">

AI Engineer • IoT Developer • Security Researcher

</text>



<text x="450"
y="185"
text-anchor="middle"
font-family="monospace"
font-size="15"
fill="#94a3b8">

Turning ideas into secure digital solutions

</text>



<!-- Floating particles -->

<g fill="#a855f7">


<circle cx="180"
cy="90"
r="4">

<animate attributeName="cy"
values="90;60;90"
dur="4s"
repeatCount="indefinite"/>

</circle>


<circle cx="720"
cy="160"
r="4">

<animate attributeName="cy"
values="160;120;160"
dur="5s"
repeatCount="indefinite"/>

</circle>


</g>



</svg>
