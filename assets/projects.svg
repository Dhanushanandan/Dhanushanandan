<svg width="1000"
height="300"
viewBox="0 0 1000 300"
xmlns="http://www.w3.org/2000/svg">


<defs>

<linearGradient id="projectBg"
x1="0"
y1="0"
x2="1"
y2="1">

<stop offset="0%"
stop-color="#020617"/>

<stop offset="100%"
stop-color="#172554"/>

</linearGradient>


<linearGradient id="projectText">

<stop offset="0%"
stop-color="#38bdf8"/>

<stop offset="100%"
stop-color="#c084fc"/>

</linearGradient>


</defs>



<!-- Background -->

<rect width="1000"
height="300"
rx="30"
fill="url(#projectBg)"/>



<!-- Grid -->

<g stroke="#334155"
opacity="0.4">

<path d="M50 50 H950"/>

<path d="M50 100 H950"/>

<path d="M50 150 H950"/>

<path d="M50 200 H950"/>

<path d="M100 30 V250"/>

<path d="M200 30 V250"/>

<path d="M300 30 V250"/>

<path d="M400 30 V250"/>

<path d="M500 30 V250"/>

<path d="M600 30 V250"/>

<path d="M700 30 V250"/>

<path d="M800 30 V250"/>

</g>



<!-- Header -->

<text x="500"
y="80"
text-anchor="middle"
font-family="Segoe UI"
font-size="42"
font-weight="700"
fill="url(#projectText)">

Featured Projects

</text>



<!-- Project Cards -->

<g font-family="Segoe UI">



<!-- Card 1 -->

<rect x="80"
y="125"
width="230"
height="110"
rx="15"
fill="#0f172a"
stroke="#38bdf8"/>


<text x="195"
y="165"
text-anchor="middle"
font-size="20"
fill="#38bdf8">

🏥 Healthcare IoT

</text>


<text x="195"
y="195"
text-anchor="middle"
font-size="13"
fill="#cbd5e1">

Arduino + AI + Sensors

</text>



<!-- Card 2 -->

<rect x="385"
y="125"
width="230"
height="110"
rx="15"
fill="#0f172a"
stroke="#818cf8"/>


<text x="500"
y="165"
text-anchor="middle"
font-size="20"
fill="#818cf8">

🤖 AI Projects

</text>


<text x="500"
y="195"
text-anchor="middle"
font-size="13"
fill="#cbd5e1">

ML Prediction Systems

</text>




<!-- Card 3 -->

<rect x="690"
y="125"
width="230"
height="110"
rx="15"
fill="#0f172a"
stroke="#c084fc"/>


<text x="805"
y="165"
text-anchor="middle"
font-size="20"
fill="#c084fc">

🔐 Security

</text>


<text x="805"
y="195"
text-anchor="middle"
font-size="13"
fill="#cbd5e1">

Secure Applications

</text>



</g>



<!-- Floating Animation -->

<circle cx="50"
cy="260"
r="5"
fill="#38bdf8">

<animate attributeName="cx"
values="50;950;50"
dur="10s"
repeatCount="indefinite"/>

</circle>


</svg>
