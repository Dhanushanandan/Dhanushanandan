<svg width="1200"
height="220"
viewBox="0 0 1200 220"
xmlns="http://www.w3.org/2000/svg">


<defs>


<linearGradient id="footerGradient"
x1="0"
y1="0"
x2="1"
y2="1">


<stop offset="0%"
stop-color="#020617"/>


<stop offset="50%"
stop-color="#1e1b4b"/>


<stop offset="100%"
stop-color="#0f172a"/>


</linearGradient>


<linearGradient id="footerText">


<stop offset="0%"
stop-color="#38bdf8"/>


<stop offset="100%"
stop-color="#c084fc"/>


</linearGradient>


</defs>




<!-- Footer Background -->


<rect width="1200"
height="220"
fill="url(#footerGradient)"/>




<!-- Wave Animation -->


<path d="M0 120 Q300 40 600 120 T1200 100 V220 H0 Z"
fill="#1e293b"
opacity="0.7">


<animate attributeName="d"

values="
M0 120 Q300 40 600 120 T1200 100 V220 H0 Z;

M0 100 Q300 160 600 90 T1200 120 V220 H0 Z;

M0 120 Q300 40 600 120 T1200 100 V220 H0 Z
"

dur="8s"

repeatCount="indefinite"/>


</path>




<!-- Main Footer Text -->


<text x="600"
y="100"
text-anchor="middle"
font-family="Segoe UI"
font-size="34"
font-weight="700"
fill="url(#footerText)">

Thanks for visiting my profile 🚀

</text>



<text x="600"
y="145"
text-anchor="middle"
font-family="monospace"
font-size="18"
fill="#cbd5e1">

Code • Create • Secure • Innovate

</text>




<!-- Social Style Icons -->


<g fill="#38bdf8">


<circle cx="500"
cy="180"
r="5">

<animate attributeName="cy"
values="180;170;180"
dur="3s"
repeatCount="indefinite"/>

</circle>


<circle cx="600"
cy="180"
r="5">

<animate attributeName="cy"
values="170;180;170"
dur="4s"
repeatCount="indefinite"/>

</circle>


<circle cx="700"
cy="180"
r="5">

<animate attributeName="cy"
values="180;170;180"
dur="5s"
repeatCount="indefinite"/>

</circle>


</g>



</svg>
